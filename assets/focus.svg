<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-label="Focus areas: AI and automation, backend and APIs, full stack, desktop apps, data and infrastructure."><title>Focus areas: AI and automation, backend and APIs, full stack, desktop apps, data and infrastructure.</title><defs></defs><style>text{font-family:'Segoe UI','SF Pro Text','Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,monospace}</style><g transform="translate(0,0)"><rect width="280" height="158" rx="14" fill="#101A2B"/><rect x=".5" y=".5" width="279" height="157" rx="13.5" fill="none" stroke="#1E2D45"/><rect x="20" y="20" width="44" height="44" rx="12" fill="#0B1220" stroke="#1E2D45"/><g transform="translate(28,28)"><g fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="3.2"/><circle cx="5" cy="6" r="2.2"/><circle cx="23" cy="6" r="2.2"/><circle cx="5" cy="23" r="2.2"/><circle cx="23" cy="23" r="2.2"/><path d="M11.6 11.8 6.8 7.6M16.4 11.8l4.8-4.2M11.6 16.2l-4.8 5M16.4 16.2l4.8 5"/></g></g><text x="24" y="90" font-size="16.5" font-weight="700" fill="#E6EDF3">AI and Automation</text><text x="24" y="112" font-size="12.5" fill="#93A7BB">Agents, MCP servers, LLM</text><text x="24" y="130" font-size="12.5" fill="#93A7BB">integrations with Gemini and</text><text x="24" y="148" font-size="12.5" fill="#93A7BB">OpenAI, Puppeteer and Selenium</text></g><g transform="translate(300,0)"><rect width="280" height="158" rx="14" fill="#101A2B"/><rect x=".5" y=".5" width="279" height="157" rx="13.5" fill="none" stroke="#1E2D45"/><rect x="20" y="20" width="44" height="44" rx="12" fill="#0B1220" stroke="#1E2D45"/><g transform="translate(28,28)"><g fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-6 6 6 6M19 8l6 6-6 6M16 5l-4 18"/></g></g><text x="24" y="90" font-size="16.5" font-weight="700" fill="#E6EDF3">Backend and APIs</text><text x="24" y="112" font-size="12.5" fill="#93A7BB">Node.js, Express, REST and GraphQL,</text><text x="24" y="130" font-size="12.5" fill="#93A7BB">plus Django and Spring</text></g><g transform="translate(600,0)"><rect width="280" height="158" rx="14" fill="#101A2B"/><rect x=".5" y=".5" width="279" height="157" rx="13.5" fill="none" stroke="#1E2D45"/><rect x="20" y="20" width="44" height="44" rx="12" fill="#0B1220" stroke="#1E2D45"/><g transform="translate(28,28)"><g fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 3 11 5.5L14 14 3 8.5 14 3Z"/><path d="m3 13 11 5.5L25 13M3 17.5 14 23l11-5.5"/></g></g><text x="24" y="90" font-size="16.5" font-weight="700" fill="#E6EDF3">Full stack</text><text x="24" y="112" font-size="12.5" fill="#93A7BB">React, Next.js, Angular, Vue.js and</text><text x="24" y="130" font-size="12.5" fill="#93A7BB">Tailwind CSS</text></g><g transform="translate(0,178)"><rect width="280" height="158" rx="14" fill="#101A2B"/><rect x=".5" y=".5" width="279" height="157" rx="13.5" fill="none" stroke="#1E2D45"/><rect x="20" y="20" width="44" height="44" rx="12" fill="#0B1220" stroke="#1E2D45"/><g transform="translate(28,28)"><g fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="22" height="15" rx="2.5"/><path d="M10 24h8M14 19v5"/></g></g><text x="24" y="90" font-size="16.5" font-weight="700" fill="#E6EDF3">Desktop apps</text><text x="24" y="112" font-size="12.5" fill="#93A7BB">Electron applications for</text><text x="24" y="130" font-size="12.5" fill="#93A7BB">automation and operations</text></g><g transform="translate(300,178)"><rect width="280" height="158" rx="14" fill="#101A2B"/><rect x=".5" y=".5" width="279" height="157" rx="13.5" fill="none" stroke="#1E2D45"/><rect x="20" y="20" width="44" height="44" rx="12" fill="#0B1220" stroke="#1E2D45"/><g transform="translate(28,28)"><g fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="6.5" rx="9" ry="3.5"/><path d="M5 6.5v15c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5v-15M5 14c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5"/></g></g><text x="24" y="90" font-size="16.5" font-weight="700" fill="#E6EDF3">Data</text><text x="24" y="112" font-size="12.5" fill="#93A7BB">PostgreSQL, MySQL, MongoDB, Redis</text><text x="24" y="130" font-size="12.5" fill="#93A7BB">for cache, sessions and queues, and</text><text x="24" y="148" font-size="12.5" fill="#93A7BB">SQLite</text></g><g transform="translate(600,178)"><rect width="280" height="158" rx="14" fill="#101A2B"/><rect x=".5" y=".5" width="279" height="157" rx="13.5" fill="none" stroke="#1E2D45"/><rect x="20" y="20" width="44" height="44" rx="12" fill="#0B1220" stroke="#1E2D45"/><g transform="translate(28,28)"><g fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22a5.5 5.5 0 0 1-.7-10.9A7.5 7.5 0 0 1 21.6 9.5 6.3 6.3 0 0 1 21 22H8Z"/></g></g><text x="24" y="90" font-size="16.5" font-weight="700" fill="#E6EDF3">Infrastructure</text><text x="24" y="112" font-size="12.5" fill="#93A7BB">Docker, Linux, Nginx, AWS, Google</text><text x="24" y="130" font-size="12.5" fill="#93A7BB">Cloud, CI/CD, RabbitMQ and Kafka</text></g></svg>
