<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Felipe Estrela, Backend Developer, Node.js and AI Automation">
<title>Felipe Estrela, Backend Developer, Node.js and AI Automation</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="0.6" stop-color="#101010"/><stop offset="1" stop-color="#1F1F1F"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.35" r="0.55"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/></pattern>
<clipPath id="r"><rect width="1000" height="280" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.in{opacity:0;animation:in .9s ease forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.node{animation:p 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.n2{animation-delay:.8s}.n3{animation-delay:1.6s}.n4{animation-delay:2.2s}
@keyframes p{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.flow{stroke-dasharray:4 7;animation:f 6s linear infinite}
@keyframes f{to{stroke-dashoffset:-110}}
@media (prefers-reduced-motion:reduce){.in,.node,.flow{animation:none;opacity:1}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="280" fill="url(#bg)"/>
<rect width="1000" height="280" fill="url(#grid)"/>
<rect width="1000" height="280" fill="url(#glow)"/>
<g fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4">
<path class="flow" d="M700 70 L790 120 L880 80 L930 170"/>
<path class="flow" d="M790 120 L760 210 L860 235"/>
<path class="flow" d="M880 80 L940 40"/>
<path class="flow" d="M760 210 L700 160 L700 70"/>
</g>
<g fill="#E8E8E8">
<circle class="node" cx="700" cy="70" r="5"/>
<circle class="node n2" cx="790" cy="120" r="8"/>
<circle class="node n3" cx="880" cy="80" r="5"/>
<circle class="node n4" cx="930" cy="170" r="6"/>
<circle class="node n2" cx="760" cy="210" r="5"/>
<circle class="node n3" cx="860" cy="235" r="4"/>
<circle class="node" cx="700" cy="160" r="4"/>
<circle class="node n4" cx="940" cy="40" r="4"/>
</g>
<circle cx="790" cy="120" r="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"/>
<text class="in d1" x="64" y="92" font-size="15" font-weight="600" letter-spacing="4" fill="#A8A8A8">BACKEND DEVELOPER</text>
<text class="in d2" x="62" y="168" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#FAFAFA">Felipe Estrela</text>
<text class="in d3" x="64" y="212" font-size="26" font-weight="400" fill="#D0D0D0">Node.js &amp; AI Automation</text>
<text class="in d3" x="64" y="244" font-size="14" letter-spacing="1" fill="#7A7A7A">Toledo, Paraná, Brazil</text>
<rect x="0" y="276" width="1000" height="4" fill="url(#line)"/>
</g>
</svg>
